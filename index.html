<!doctype html>
<html lang="es" class="h-100">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración - Biblioteca Ohara</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column vh-100 bg-light m-0 overflow-hidden">
  <!-- Barra de navegación superior para móviles -->
  <div class="d-md-none bg-dark text-white p-2 d-flex align-items-center overflow-auto shadow-sm flex-shrink-0">
    <a href="#" data-section="inicio"
      class="logo-inicio text-white text-decoration-none me-3 d-flex align-items-center flex-shrink-0 ps-2">
      <i class="bi bi-book-half text-success fs-6 me-1"></i>
      <span class="fw-bold text-nowrap fs-6">Biblioteca Ohara</span>
    </a>
    <ul class="nav nav-pills flex-row flex-nowrap gap-1">
      <li class="nav-item">
        <a class="nav-link py-1 px-2 fs-6 text-white" href="#" data-section="inicio" title="Inicio">
          <i class="bi bi-speedometer2"></i>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link py-1 px-2 fs-6 text-white" href="#" data-section="editoriales" title="Editoriales"><i
            class="bi bi-building"></i></a>
      </li>
      <li class="nav-item">
        <a class="nav-link py-1 px-2 fs-6 text-white" href="#" data-section="libros" title="Libros">
          <i class="bi bi-journal-bookmark"></i>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link py-1 px-2 fs-6 text-white" href="#" data-section="ejemplares" title="Ejemplares"><i
            class="bi bi-qr-code-scan"></i></a>
      </li>
      <li class="nav-item">
        <a class="nav-link py-1 px-2 fs-6 text-white" data-section="prestamos" title="Préstamos"
          id="mnuMovilPrestamos"><i class="bi bi-arrow-left-right"></i></a>
      </li>
    </ul>
  </div>

  <!-- Contenedor principal -->
  <div class="d-flex flex-grow-1 vh-100 w-100 m-0 p-0 overflow-hidden">
    <!-- Panel de Navegación Lateral / Sidebar -->
    <aside class="bg-dark text-white p-3 d-none d-md-flex flex-column vh-100 overflow-auto flex-shrink-0"
      style="width: 260px">
      <a href="#" data-section="inicio"
        class="logo-inicio d-flex align-items-center mb-4 text-white text-decoration-none border-bottom border-secondary pb-3 flex-shrink-0">
        <i class="bi bi-book-half fs-5 text-success me-2"></i>
        <span class="fw-bold text-nowrap fs-6">Biblioteca Ohara</span>
      </a>

      <!-- Menú de Entidades del CRUD -->
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-1">
          <a href="#" class="nav-link text-nowrap fs-6 text-white" data-section="inicio">
            <i class="bi bi-speedometer2 me-2"></i>
            <span>Inicio</span>
          </a>
        </li>
        <li class="nav-item mb-1">
          <a href="#" class="nav-link text-nowrap fs-6 text-white" data-section="editoriales">
            <i class="bi bi-building me-2"></i>
            <span>Editoriales</span>
          </a>
        </li>
        <li class="nav-item mb-1">
          <a href="#" class="nav-link text-nowrap fs-6 text-white" data-section="libros">
            <i class="bi bi-journal-bookmark me-2"></i>
            <span>Libros</span>
          </a>
        </li>
        <li class="nav-item mb-1">
          <a href="#" class="nav-link text-nowrap fs-6 text-white" data-section="ejemplares">
            <i class="bi bi-qr-code-scan me-2"></i>
            <span>Ejemplares</span>
          </a>
        </li>
        <li class="nav-item mb-1">
          <a href="#" class="nav-link text-nowrap fs-6 text-white" data-section="prestamos" id="mnuPrestamos">
            <i class="bi bi-arrow-left-right me-2"></i>
            <span>Préstamos</span>
          </a>
        </li>
      </ul>

      <!-- Bloque del Responsable -->
      <div class="pt-3 border-top border-secondary flex-shrink-0">
        <div class="d-flex align-items-center mb-1">
          <i class="bi bi-person-badge-fill text-success fs-6 me-2"></i>
          <span class="small fw-bold text-uppercase text-nowrap">Responsable</span>
        </div>
        <div id="nombre-responsable" class="small text-white text-nowrap ps-4">
          <!-- Se rellenará dinámicamente con JavaScript -->
        </div>
      </div>
    </aside>

    <!-- ÁREA DE CONTENIDO DE LAS SECCIONES (Añade esto para que la SPA funcione visualmente) -->
    <main class="flex-grow-1 p-4 overflow-auto bg-white">
      <section id="sec-inicio" class="seccion-spa">
        <h2>Panel de Inicio</h2>
        <p>Bienvenido al sistema de gestión.</p>
      </section>

      <section id="sec-editoriales" class="seccion-spa d-none">
        <h2>Gestión de Editoriales</h2>
        <!-- Aquí irá tu tabla y formulario de editoriales -->
      </section>

      <section id="sec-libros" class="seccion-spa d-none">
        <h2>Gestión de Libros</h2>
        <!-- Aquí irá tu tabla y formulario de libros -->
      </section>

      <section id="sec-ejemplares" class="seccion-spa d-none">
        <h2>Gestión de Ejemplares</h2>
        <!-- Aquí irá tu tabla y formulario de ejemplares -->
      </section>

      <!-- Gestión de préstamos -->
      <section id="sec-prestamos" class="seccion-spa d-none">
        <div class="border-bottom border-dark-subtle pb-2 mb-3">
          <h2 class="h4 fw-bold text-dark mb-0">
            <i class="bi bi-arrow-left-right text-success me-2"></i>
            Gestión de Préstamos
          </h2>
        </div>

        <button type="button" class="btn btn-success shadow" id="btnAltaPrestamo">
          <i class="bi bi-plus-circle me-1"></i> Nuevo Préstamo
        </button>

        <!-- Tabla de Préstamos -->
        <div class="table-responsive border rounded mt-3" name="listadoPrestamos" id="listadoPrestamos">
        </div>

        <!-- Formulario Alta Prestamo -->
        <form class="form-horizontal d-none" name="frmAltaPrestamo" id="frmAltaPrestamo">
          <fieldset>
            <!-- Form Name -->
            <legend>Alta de componente</legend>

            <!-- Text input-->
            <div class="form-group">
              <label class="col-xs-4 control-label" for="txtAltaNombre">Nombre del componente</label>
              <div class="col-xs-4">
                <input id="txtAltaNombre" name="txtAltaNombre" class="form-control input-md" type="text">

              </div>
            </div>
            <!-- Text input-->
            <div class="form-group">
              <label class="col-xs-4 control-label" for="txtAltaDescripcion">Descripción</label>
              <div class="col-xs-4">
                <input id="txtAltaDescripcion" name="txtAltaDescripcion" class="form-control input-md" type="text">
              </div>
            </div>
            <!-- Number input-->
            <div class="form-group">
              <label class="col-xs-4 control-label" for="txtAltaPrecio">Precio</label>
              <div class="col-xs-4">
                <input id="txtAltaPrecio" name="txtAltaPrecio" class="form-control input-md" type="number">
              </div>
            </div>
            <div class="form-group">
              <label class="col-xs-4 control-label" for="lstAltaTipo">Tipo</label>
              <div class="col-xs-4">
                <select class="form-select" name="lstAltaTipo" id="lstAltaTipo">

                </select>
              </div>
            </div>
            <!-- Button -->
            <div class="form-group">
              <label class="col-xs-4 control-label" for="btnAceptarAltaComponente"></label>
              <div class="col-xs-4">
                <input type="button" id="btnAceptarAltaComponente" name="btnAceptarAltaComponente"
                  class="btn btn-primary" value="Aceptar" />
              </div>
            </div>

          </fieldset>
        </form>

      </section>

    </main>
  </div>
  <!-- Script para el cambio de nombre dinamicamente -->
  <script src="js/selector-nombres.js"></script>
  <script type="text/javascript" src="js/ajax.js"></script>
  <script type="text/javascript" src="js/objetos-prestamos.js"></script>
  <script type="text/javascript" src="js/codigo-prestamos.js"></script>
</body>

</html>
